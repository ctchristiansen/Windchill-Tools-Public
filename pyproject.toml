[project]
name = "windchill-tools"
version = "0.1.0"
description = "Tools and scripts for PTC Windchill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windchill-api",
    "windchill-scripts",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "scripts"]

[tool.uv.sources]
windchill-api = { workspace = true }
windchill-scripts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
